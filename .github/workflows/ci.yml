# Checks every push and pull request the same way as before each local
# commit: the analyzer, then every test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --timeout 60s
      # Long bot match-ups, skipped in the run above.
      - run: flutter test --tags strength --run-skipped
